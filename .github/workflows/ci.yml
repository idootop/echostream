name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Rust Check & Clippy & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --exclude echostream-python --exclude echostream-node --all-targets --all-features -- -D warnings
      - name: 单元与集成测试
        run: cargo test -p echostream-proto -p echostream-core -p echostream-transport
      - name: 示例冒烟（RPC/Event/Stream 端到端）
        run: cargo run -p echostream --example simple_rpc && cargo run -p echostream --example bidi
      - name: 插件栈冒烟（认证/重连/日志）
        run: cargo run -p echostream --example plugin_stack

  wasm:
    name: WASM 编解码与状态机验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
        with:
          version: 9
          run_install: false
          cache: true
          cache_dependency_path: |
            bindings/node/pnpm-lock.yaml
            bindings/web/pnpm-lock.yaml
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: 构建 WASM（release）
        run: cargo build -p echostream-wasm --target wasm32-unknown-unknown --release
      - name: 生成胶水代码
        run: |
          cargo install wasm-bindgen-cli --version 0.2.106 --locked
          wasm-bindgen --target nodejs --out-dir bindings/wasm/node target/wasm32-unknown-unknown/release/echostream_wasm.wasm
          wasm-bindgen --target web --out-dir bindings/web/wasm target/wasm32-unknown-unknown/release/echostream_wasm.wasm
      - name: 构建 TypeScript（pnpm + tsdown，仅 ESM）
        run: |
          pnpm install --dir bindings/node --frozen-lockfile
          pnpm install --dir bindings/web --frozen-lockfile
          pnpm --dir bindings/node build
          pnpm --dir bindings/web build
      - name: 编解码交叉验证
        run: node bindings/web/dist/test/echostream.test.js
      - name: 客户端状态机验证
        run: node bindings/web/dist/test/client_core.test.js
      - name: Node 纯 JS 编解码 vs WASM 交叉验证
        run: node bindings/node/dist/test/codec.test.js

  bindings:
    name: Node.js binding 端到端
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
        with:
          version: 9
          run_install: false
          cache: true
          cache_dependency_path: |
            bindings/node/pnpm-lock.yaml
            bindings/web/pnpm-lock.yaml
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: 构建 Node binding
        run: |
          cargo build -p echostream-node --release
          cp target/release/libechostream_node.so bindings/node/echostream-node.node
      - name: 构建 TypeScript（pnpm + tsdown，仅 ESM）
        run: |
          pnpm install --dir bindings/node --frozen-lockfile
          pnpm install --dir bindings/web --frozen-lockfile
          pnpm --dir bindings/node build
          pnpm --dir bindings/web build
      - name: 端到端测试（server + client 闭环，自动编解码 DX）
        run: node bindings/node/dist/test/server.test.js
      - name: 浏览器 SDK 端到端（Rust WS 服务端）
        run: node bindings/web/dist/test/e2e.sdk.test.js
