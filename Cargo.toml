[workspace]
members = [
    "crates/echostream",
    "crates/echostream-core",
    "crates/echostream-proto",
    "crates/echostream-transport",
    "crates/echostream-derive",
    "plugins/echostream-plugin-auth",
    "plugins/echostream-plugin-reconnect",
    "plugins/echostream-plugin-retry",
    "plugins/echostream-plugin-metrics",
    "plugins/echostream-plugin-heartbeat",
    "extensions/echostream-discovery",
    "extensions/echostream-file",
    "extensions/echostream-av",
    "middlewares/echostream-middleware-logging",
    "middlewares/echostream-middleware-timeout",
    "middlewares/echostream-middleware-error",
    "middlewares/echostream-middleware-transform",
    "bindings/node",
    "bindings/wasm",
    "bindings/python",
]
resolver = "2"

# 默认构建仅 crates（bindings 使用各自工具链：napi-rs / maturin / wasm-bindgen）
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Del Wang <hello@xbox.work>"]
license = "MIT"
repository = "https://github.com/idootop/echostream"
homepage = "https://github.com/idootop/echostream"
documentation = "https://docs.rs/echostream"
keywords = ["rpc", "quic", "streaming", "real-time", "async"]
categories = ["network-programming", "asynchronous"]

[workspace.dependencies]
# Internal crates
echostream = { path = "crates/echostream", version = "0.1.0" }
echostream-core = { path = "crates/echostream-core", version = "0.1.0" }
echostream-proto = { path = "crates/echostream-proto", version = "0.1.0" }
echostream-transport = { path = "crates/echostream-transport", version = "0.1.0" }
echostream-derive = { path = "crates/echostream-derive", version = "0.1.0" }
echostream-discovery = { path = "extensions/echostream-discovery", version = "0.1.0" }
echostream-file = { path = "extensions/echostream-file", version = "0.1.0" }
echostream-av = { path = "extensions/echostream-av", version = "0.1.0" }

# External dependencies
quinn = { version = "0.11.11", default-features = false, features = ["rustls-ring", "log", "runtime-tokio"] }
tokio = { version = "1.53.1", features = ["full"] }
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
bytes = { version = "1.12.1", features = ["serde"] }
async-trait = "0.1.92"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
thiserror = "2.0.20"
anyhow = "1.0.104"
mdns-sd = "0.21.0"

# TLS / QUIC 证书
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1.15.1"
rcgen = "0.14.9"

# Proc-macro dependencies
syn = { version = "3.0.3", features = ["full"] }
quote = "1.0.47"
proc-macro2 = "1.0.107"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
