[package]
name = "echostream-python"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "EchoStream Python binding (PyO3)"

[lib]
name = "echostream_python"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.2", features = ["extension-module"] }
echostream = { path = "../../crates/echostream" }
echostream-core = { path = "../../crates/echostream-core" }
bytes = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
