[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "echostream"
version = "0.1.0"
description = "EchoStream Python binding — 基于 QUIC 的双向 RPC 与流传输"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "echostream"
