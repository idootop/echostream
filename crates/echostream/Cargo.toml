[package]
name = "echostream"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "基于 QUIC 的双向 RPC 和流传输框架 - 统一入口"

[dependencies]
echostream-core = { workspace = true }
echostream-proto = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }

echostream-derive = { workspace = true, optional = true }
echostream-discovery = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
default = ["derive", "discovery"]
derive = ["dep:echostream-derive"]
discovery = ["dep:echostream-discovery"]
