[package]
name = "echostream"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "基于 QUIC 的双向 RPC 和流传输框架 - 统一入口"

[dependencies]
echostream-core = { workspace = true }
echostream-transport = { workspace = true }
echostream-proto = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }

echostream-derive = { workspace = true, optional = true }
echostream-discovery = { workspace = true, optional = true }
futures = "0.3"

[dev-dependencies]
tokio = { workspace = true }
echostream-plugin-auth = { path = "../../plugins/echostream-plugin-auth" }
echostream-plugin-retry = { path = "../../plugins/echostream-plugin-retry" }
echostream-plugin-reconnect = { path = "../../plugins/echostream-plugin-reconnect" }
echostream-middleware-logging = { path = "../../middlewares/echostream-middleware-logging" }
bytes = { workspace = true }
postcard = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
default = ["derive", "discovery"]
derive = ["dep:echostream-derive"]
discovery = ["dep:echostream-discovery"]
